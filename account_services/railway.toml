# Railway config for Account Service (web).
# In Railway: create a service from this repo, set Root Directory = account_services.
# Workers: duplicate this service and override Start Command (see RAILWAY.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./start.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
