# Railway config for Fraud Service (FastAPI).
# In Railway: create a service from this repo, set Root Directory = fraud_service.
# The Dockerfile CMD already respects $PORT (defaults to 8006 locally).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
